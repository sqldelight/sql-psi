[versions]
# AS releases: https://plugins.jetbrains.com/docs/intellij/android-studio-releases-list.html
# IC sources: https://www.jetbrains.com/intellij-repository/releases
# choose a matching/similar build

ideaVersion = "253.32098.37" # AS Panda 4 | 2025.3.4
kotlin = "2.4.21"

[libraries]
intellijCoreImpl = { module = "com.jetbrains.intellij.platform:core-impl", version.ref = "ideaVersion" }
intellijProjectModelImpl = { module = "com.jetbrains.intellij.platform:project-model-impl", version.ref = "ideaVersion" }
intellijAnalysisImpl = { module = "com.jetbrains.intellij.platform:analysis-impl", version.ref = "ideaVersion" }
intellijIndexing = { module = "com.jetbrains.intellij.platform:indexing", version.ref = "ideaVersion" }
intellijCore = { module = "com.jetbrains.intellij.platform:core", version.ref = "ideaVersion" }
intellijUtil = { module = "com.jetbrains.intellij.platform:util", version.ref = "ideaVersion" }
intellijExtensions = { module = "com.jetbrains.intellij.platform:extensions", version.ref = "ideaVersion" }
intellijAnalysis = { module = "com.jetbrains.intellij.platform:analysis", version.ref = "ideaVersion" }
intellijProjectModel = { module = "com.jetbrains.intellij.platform:project-model", version.ref = "ideaVersion" }
intellijLang = { module = "com.jetbrains.intellij.platform:lang", version.ref = "ideaVersion" }
intellijIcons = { module = "com.jetbrains.intellij.platform:icons", version.ref = "ideaVersion" }
intellijUtilUi = { module = "com.jetbrains.intellij.platform:util-ui", version.ref = "ideaVersion" }
coroutines-core = "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.13.0"

junit = "junit:junit:4.13.2"
assertk = "com.willowtreeapps.assertk:assertk:0.28.1"

ktfmt = "com.facebook:ktfmt:0.64"

[bundles]
intelliJ = ["intellijCoreImpl", "intellijProjectModelImpl", "intellijAnalysisImpl", "intellijIndexing", "intellijUtilUi", "intellijCore", "intellijUtil", "intellijExtensions", "intellijAnalysis", "intellijProjectModel", "intellijLang", "intellijIcons"]

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
grammarKitComposer = { id = "app.cash.grammarkit-composer", version = "0.2.0" }
spotless = { id = "com.diffplug.spotless", version = "8.11.0" }
mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
dokka = { id = "org.jetbrains.dokka", version = "2.3.0" }
intellij = { id = "org.jetbrains.intellij.platform", version = "2.20.1" }
